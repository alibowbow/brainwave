name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Install browser
        run: npx playwright-core install --with-deps chromium

      - name: Start built preview
        id: preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/brainwave-preview.log 2>&1 &
          ./node_modules/.bin/vite --config components/immersiveWorlds/forest/harness.vite.config.ts > /tmp/brainwave-forest-harness.log 2>&1 &
          curl --fail --silent --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173
          curl --fail --silent --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4178/components/immersiveWorlds/forest/harness.html

      - name: Verify scene experience
        env:
          SCENE_SCREENSHOT_DIR: qa/screenshots
        run: |
          npm run verify:scenes
          npm run verify:focus
          npm run verify:sea
          npm run verify:links

      - name: Preserve protected and existing scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-core
          path: |
            qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify audio failures and recovery
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          SCENE_SCREENSHOT_DIR: qa/screenshots
        run: npm run verify:audio

      - name: Preserve audio screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-audio
          path: |
            qa/screenshots/audio
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify admitted immersive worlds
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          SCENE_SCREENSHOT_DIR: qa/screenshots
          SCENE_FOREST_HARNESS_URL: http://127.0.0.1:4178/components/immersiveWorlds/forest/harness.html
        run: timeout --signal=TERM --kill-after=10s 20m npm run verify:worlds

      - name: Preserve forest screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-forest
          path: |
            qa/screenshots/worlds/forest-*
            components/immersiveWorlds/forest/qa/ci-output
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify integrated cafe world
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          SCENE_SCREENSHOT_DIR: qa/screenshots
        run: timeout --signal=TERM --kill-after=10s 20m npm run verify:cafe

      - name: Preserve cafe screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-cafe
          path: |
            qa/screenshots/worlds/cafe-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify integrated cosmic world
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          SCENE_SCREENSHOT_DIR: qa/screenshots
        run: timeout --signal=TERM --kill-after=10s 20m npm run verify:cosmic

      - name: Preserve cosmic screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-cosmic
          path: |
            qa/screenshots/worlds/cosmic-*
          if-no-files-found: ignore
          retention-days: 14
