<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Woods isolated visual verification</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101812; }
      * { box-sizing: border-box; }
      .qa-holder { position: absolute; inset: 0; min-width: 1px; min-height: 1px; }
      .qa-holder-secondary { z-index: 2; }
      .qa-controls { position: fixed; z-index: 5; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
      .qa-controls button { padding: 9px 12px; border: 1px solid #ffffff55; border-radius: 6px; background: #102219de; color: white; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./harness.tsx"></script></body>
</html>
