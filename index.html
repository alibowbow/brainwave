<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="집중·이완·수면을 위한 로컬 퍼스트 뇌파 리듬 및 자연음 스튜디오" />
    <title>Brainwave · Ritual Studio</title>
    <link rel="icon" type="image/svg+xml" href="/brainwave/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brainwave/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/brainwave/apple-touch-icon.png" />
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('mc_brain_settings') || 'null');
        document.documentElement.classList.toggle('dark', stored?.darkMode ?? true);
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <script type="module" crossorigin src="/brainwave/assets/index-ysrQX4Sa.js"></script>
    <link rel="stylesheet" crossorigin href="/brainwave/assets/index-CwHiUg6S.css">
  <link rel="manifest" href="/brainwave/manifest.webmanifest"></head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Shared SVG lighting filter that gives the flat scene characters a soft, puffy 3D sheen -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="scPuffy" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="b" />
          <feSpecularLighting in="b" surfaceScale="2.3" specularConstant="0.6" specularExponent="20" lighting-color="#ffffff" result="s">
            <feDistantLight azimuth="235" elevation="60" />
          </feSpecularLighting>
          <feComposite in="s" in2="SourceAlpha" operator="in" result="sc" />
          <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
  </body>
</html>
